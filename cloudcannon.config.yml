timezone: America/New_York
paths:
  static: public
  uploads: public/assets/images

collection_groups:
  - heading: Content
    collections:
      - pages

data_config:
  site:
    path: src/data/site.json

file_config:
  - glob: src/data/site.json
    _inputs:
      brand.logo:
        type: image
      brand.logo_alt:
        type: text
      brand.name:
        type: text
      brand.tagline:
        type: text
      navigation:
        type: array
        options:
          structures: _structures.navigation_items
      contact.phone:
        type: text
      contact.phone_url:
        type: text
      contact.email:
        type: text
      contact.email_url:
        type: text
      contact.cancellation_note:
        type: textarea
      contact.location_note:
        type: textarea

collections_config:
  pages:
    path: src/content/pages
    url: "/[slug]/"
    icon: wysiwyg
    _enabled_editors:
      - visual
      - data
    schemas:
      page_builder:
        path: .cloudcannon/schemas/page-builder.md
        name: Page Builder
        new_preview_url: /training/
    add_options:
      - name: Page Builder
        schema: page_builder

_editables:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    blockquote: true
    format: "p h2 h3 h4"

_structures:
  content_blocks:
    values:
      - label: Visual section
        icon: article
        picker_preview:
          text:
            - Visual section
          icon:
            - article
        preview:
          text:
            - key: label
            - Visual section
          icon:
            - article
        value:
          _type: visual_section
          label: New section
          content: "<section class=\"section\"><div class=\"container\"><h2>New section</h2><p>Add content here.</p></div></section>"
        _inputs:
          label:
            type: text
          content:
            type: html
            options:
              allow_custom_markup: true
  navigation_items:
    values:
      - label: Navigation link
        icon: link
        picker_preview:
          text:
            - Navigation link
          icon:
            - link
        preview:
          text:
            - key: label
            - Navigation link
          icon:
            - link
        value:
          label: New link
          url: "/"
          primary: false
        _inputs:
          label:
            type: text
          url:
            type: text
          primary:
            type: switch

_inputs:
  _schema:
    hidden: true
  title:
    type: text
  description:
    type: textarea
  content_blocks:
    type: array
    options:
      structures: _structures.content_blocks
